[workspace]
resolver = "2"
members = [
  ".",
  "conf_derive",
  "conf_extra",
]

[workspace.package]
repository = "https://github.com/cbeck88/conf-rs"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.85"  # MSRV
include = [
  "src/**/*",
  "Cargo.toml",
  "LICENSE*",
  "README.md",
  "REFERENCE*.md",
]

[package]
name = "conf"
version = "0.1.1"
description = "A derive-based config parser for CLI args, env, and structured config files"
categories = ["command-line-interface"]
keywords = [
  "argument",
  "config",
  "configuration",
  "settings",
  "environment"
]
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
include.workspace = true

[lib]
bench = false

[dependencies]
conf_derive = { path = "./conf_derive", version = "0.1.1" }
clap = { version = "4.5.8", features = ["string"] }
clap_lex = { version = "0.7" }
serde = { version = "1", optional = true }

[features]
default = ["serde"]

[dev-dependencies]
assert_matches = "1.5"
escargot = "0.5"
figment = { version = "0.10", features = ["json", "toml"] }
http = { version = "1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
